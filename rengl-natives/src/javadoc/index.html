<h1>RenGL natives</h1>
<p>This artifact has no classes. Its jar holds the Skiko runtime of one platform, and its pom depends on LWJGL's
natives for the same platform. Add the one for each platform your app runs on.</p>
<p>The guides are at
<a href="https://github.com/piitex/RenGL/tree/main/docs">github.com/piitex/RenGL/tree/main/docs</a>.</p>

name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The GPU tests skip themselves when the runner has no usable GPU, so this checks that every module
      # compiles and that the tests that need no GPU pass. It does not prove anything about rendering.
      - name: Build and test
        shell: bash
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

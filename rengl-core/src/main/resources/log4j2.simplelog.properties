# log4j-core is intentionally not a dependency (its startup hostname lookup stalls launch for
# seconds on some machines), so logging goes through the log4j-api simple logger.
org.apache.logging.log4j.simplelog.level=TRACE
org.apache.logging.log4j.simplelog.logFile=system.out
org.apache.logging.log4j.simplelog.showdatetime=true
org.apache.logging.log4j.simplelog.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.apache.logging.log4j.simplelog.showContextMap=false
org.apache.logging.log4j.simplelog.showlogname=true
org.apache.logging.log4j.simplelog.showShortLogname=false
